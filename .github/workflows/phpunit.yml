name: PHPUnit

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'cursor/**']
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is EOL with no upstream fix for CVE-2026-109618/109619.
        # Prefer patched patch-levels: 8.2.35+, 8.3.36+, 8.4.27+, 8.5.12+.
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Show PHP version
        run: php -v

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
